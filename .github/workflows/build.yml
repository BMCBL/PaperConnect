name: Build PaperConnect

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            library: paperconnect_native.dll
            asset: paperconnect-native-abi1-windows-x86_64-msvc.dll
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            library: paperconnect_native.dll
            asset: paperconnect-native-abi1-windows-aarch64-msvc.dll
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            library: libpaperconnect_native.so
            asset: paperconnect-native-abi1-linux-x86_64-gnu.so
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            library: libpaperconnect_native.so
            asset: paperconnect-native-abi1-linux-aarch64-gnu.so
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev cmake pkg-config protobuf-compiler
      - name: Build native component
        shell: pwsh
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_LIBRARY: ${{ matrix.library }}
          NATIVE_ASSET: ${{ matrix.asset }}
        run: |
          rustup target add $env:NATIVE_TARGET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --profile native-release --target $env:NATIVE_TARGET -p paperconnect-native
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $file = Join-Path 'target' "$env:NATIVE_TARGET/native-release/$env:NATIVE_LIBRARY"
          New-Item -ItemType Directory -Path 'artifacts' | Out-Null
          $asset = Join-Path 'artifacts' $env:NATIVE_ASSET
          Copy-Item -LiteralPath $file -Destination $asset
          $sha = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$asset.sha256", "$sha  $env:NATIVE_ASSET`n", [Text.Encoding]::ASCII)
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error

  plugin:
    name: Wasm plugin
    runs-on: ubuntu-22.04
    env:
      BMCBL_PLUGIN_SKIP_DEV_INSTALL: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Test and package plugin
        run: |
          rustup target add wasm32-wasip2
          cargo test --locked -p paperconnect --lib
          BMCBL_PLUGIN_PACKAGE_OUT_DIR="$PWD/artifacts" cargo build --locked --release --target wasm32-wasip2 -p paperconnect
      - uses: actions/upload-artifact@v4
        with:
          name: paperconnect-plugin
          path: artifacts/*.bmcblx
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.created)
    needs: [native, plugin]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packages=(artifacts/paperconnect-*.bmcblx)
          [[ ${#packages[@]} == 1 && -f "${packages[0]}" ]]
          file="${packages[0]##*/}"
          version="${file#paperconnect-}"
          version="${version%.bmcblx}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "$tag" ]]
            options=(--verify-tag)
          else
            options=(--target "$GITHUB_SHA")
          fi
          (cd artifacts && sha256sum --check --strict *.sha256)
          python3 - "$tag" <<'PY'
          import json
          import sys
          from pathlib import Path

          directory = Path('artifacts')
          assets = []
          for checksum in sorted(directory.glob('paperconnect-native-*.sha256')):
              digest, name = checksum.read_text(encoding='ascii').split()
              assets.append({'name': name, 'digest': f'sha256:{digest}'})
          assert len(assets) == 4, 'all native targets must provide a digest'
          index = {'tag_name': sys.argv[1], 'assets': assets}
          (directory / 'paperconnect-native.json').write_text(json.dumps(index, indent=2) + '\n', encoding='utf-8')
          PY
          gh release create "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" "${options[@]}" --generate-notes --latest
