[package]
name = "paperconnect"
version = "0.1.3"
edition = "2024"
license = "GPL-3.0"
publish = false
description = "PaperConnect multiplayer tool for BMCBL"

[workspace]
members = ["native", "protocol"]
default-members = ["."]
exclude = ["sdk/bmcbl-plugin-api", "sdk/bmcbl-plugin-macros", "vendor/easytier", "vendor/easytier-bmcbl", "vendor/nethernet", "vendor/raknet"]

[lib]
path = "plugin/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
bmcbl_plugin_api = { path = "sdk/bmcbl-plugin-api" }
getrandom = "0.4"
serde_json = "1"
semver = "1"
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
paperconnect-protocol = { path = "protocol" }

[build-dependencies]
bmcbl_plugin_api = { path = "sdk/bmcbl-plugin-api", features = ["pack"] }

[package.metadata.bmcbl-plugin]
id = "paperconnect"
name = "PaperConnect"
description = "Bedrock multiplayer and local UDP diagnostics"
capabilities = ["ui.page", "clipboard.read", "clipboard.write", "config.read", "config.write", "event.global", "network.http", "download.start"]
readme = "README.md"
icon = "assets/icon.png"
config_default = "config/default.toml"
config_schema = "config/schema.toml"

[package.metadata.bmcbl-plugin.permissions.network]
allow = [
    "https://bmcbl-plugin.chlna6666.com/v1/plugins/paperconnect.json",
    "https://bmcbl-plugin.chlna6666.com/downloads/official/paperconnect/",
    "https://github.com/BMCBL/PaperConnect/releases/",
    "https://release-assets.githubusercontent.com/",
    "https://objects.githubusercontent.com/",
]

[patch.crates-io]
dtls = { path = "vendor/dtls" }
webrtc = { path = "vendor/webrtc" }
webrtc-ice = { path = "vendor/webrtc-ice" }

[profile.native-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
debug = 0
