[package]
name = "paperconnect-native"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bmcbl_plugin_api = { path = "../sdk/bmcbl-plugin-api" }
paperconnect-protocol = { path = "../protocol" }
easytier = { package = "easytier-bmcbl", path = "../vendor/easytier-bmcbl", default-features = false, features = ["aes-gcm", "socks5", "websocket"] }
nethernet = { path = "../vendor/nethernet" }
raknet-tokio = { path = "../vendor/raknet/raknet-tokio" }
anyhow = "1"
bytes = "1"
cidr = "0.3"
once_cell = "1"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
url = "2"
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
network-interface = "2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[dev-dependencies]
tracing-subscriber = "0.3"
